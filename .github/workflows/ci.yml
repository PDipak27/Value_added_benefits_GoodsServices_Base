# VA-BAGS — PR gate on GitHub-hosted runners (free; green checks + badge on GitHub).
# CI only: build + unit + Testcontainers ITs (+ optional SonarQube). CD to EKS is Jenkins'
# job (jenkins/Jenkinsfile.eks) — see Design/12-roadmap.md (CI/CD section).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The `it` profile runs *IT via failsafe with
      # -Duser.timezone=Asia/Kolkata (postgres:18 rejects the JVM's legacy Asia/Calcutta).
      - name: Build + unit + integration tests
        run: mvn -B -ntp -Pit verify

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore

      # Gated: set repo var ENABLE_SONAR=true, var SONAR_HOST_URL, secret SONAR_TOKEN.
      - name: SonarQube analysis
        if: vars.ENABLE_SONAR == 'true'
        run: |
          mvn -B -ntp sonar:sonar \
            -Dsonar.host.url="${{ vars.SONAR_HOST_URL }}" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey=vabags
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
