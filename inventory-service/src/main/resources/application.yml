server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/vab
    username: eventuate
    password: eventuate
    driver-class-name: org.postgresql.Driver
    # Design/13 §8.1: bounded waits. A blocked pool fails in 3 s; a statement or lock wait can't hang a
    # consumer forever (55P03 / 57014 are retried by shared-messaging's decorator).
    hikari:
      connection-timeout: 3000
      data-source-properties:
        options: "-c statement_timeout=10000 -c lock_timeout=3000"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory

  flyway:
    enabled: true
    schemas: inventory
    locations: #flyway auto adds locations.
    - classpath:db/migration
#    - classpath:flyway/postgresql

eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9094

# Design/13 §8.3: pause a partition instead of buffering an unbounded backlog while a handler waits.
eventuate:
  local:
    kafka:
      consumer:
        back-pressure:
          low: 100
          high: 500

management:
  # §perf: the reservation sweeper is the only self-rooted span here — keep it unsampled so it never
  # tries to export to Tempo when obs is off. Saga spans still trace under `obs` (they inherit the root).
  tracing:
    sampling:
      probability: 0.0
  # §perf: no span export unless `obs` is active — old sampled traceparents on Kafka messages
  # would otherwise force export attempts at Tempo (parent-based sampler honours them).
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  # Design/13 §9: a dead Eventuate subscription fails liveness (k8s restarts the pod; the message is redelivered).
  endpoint:
    health:
      probes:
        enabled: true          # livenessState / readinessState exist outside k8s too
      group:
        liveness:
          include: livenessState,eventuateSubscriptions

logging:
  level:
    com.vab: DEBUG
    io.eventuate: INFO

---
# §perf: `obs` profile — allow OTLP span export to Tempo.
spring:
  config:
    activate:
      on-profile: obs
management:
  otlp:
    tracing:
      export:
        enabled: true
