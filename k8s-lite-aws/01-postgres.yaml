# Postgres (write model + Tram outbox). Study-grade: emptyDir storage (data is recreated on
# each pod start, so the init SQL re-runs — no EBS PVC/CSI needed). The `pg-init` ConfigMap is
# generated by kustomize from deploy/postgres-init/01+04 and mounted into docker-entrypoint-initdb.d,
# so the eventuate ES/Tram + saga schema exists before any service connects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vabags-lite
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - { name: POSTGRES_DB, value: vab }
            - { name: POSTGRES_USER, value: eventuate }
            - { name: POSTGRES_PASSWORD, value: eventuate }
            - { name: TZ, value: Asia/Kolkata }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "eventuate", "-d", "vab"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: data
          emptyDir: {}
        - name: initdb
          configMap: { name: pg-init }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vabags-lite
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
