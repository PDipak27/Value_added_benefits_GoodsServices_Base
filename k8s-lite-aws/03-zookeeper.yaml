# ZooKeeper — used ONLY by eventuate-cdc for leadership election (Kafka is KRaft, ZK-free).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: vabags-lite
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: zookeeper }
  template:
    metadata:
      labels: { app: zookeeper }
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.7.1
          ports:
            - containerPort: 2181
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms64m -Xmx256m" }
            - { name: TZ, value: Asia/Kolkata }
          readinessProbe:
            tcpSocket: { port: 2181 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits: { memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: vabags-lite
spec:
  selector: { app: zookeeper }
  ports:
    - port: 2181
      targetPort: 2181
