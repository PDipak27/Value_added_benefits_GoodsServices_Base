# Namespace + shared config for all VA-BAGS pods (Design/11 §3.4).
# The ConfigMap is injected into EVERY service via envFrom; services simply ignore the
# keys they don't use (e.g. inventory has no Mongo starter, so SPRING_DATA_MONGODB_URI is inert).
apiVersion: v1
kind: Namespace
metadata:
  name: vabags
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vabags-endpoints
  namespace: vabags
data:
  # ── outside-the-cluster deps → host.k3d.internal ──────────────────────
  SPRING_DATASOURCE_URL: jdbc:postgresql://host.k3d.internal:5432/vab
  SPRING_DATA_MONGODB_URI: mongodb://host.k3d.internal:27017/vab
  SPRING_DATA_REDIS_HOST: host.k3d.internal
  SPRING_DATA_REDIS_PORT: "6379"
  EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: host.k3d.internal:9095
  KEYCLOAK_ISSUER: http://host.k3d.internal:8088/realms/vab
  KEYCLOAK_TOKEN_URI: http://host.k3d.internal:8088/realms/vab/protocol/openid-connect/token
  # ── DB connection budget ─────────────────────────────────────────────────
  # HikariCP defaults to 10 conns/service → 8 services (+Keycloak+CDC) exhausts Postgres
  # max_connections (~100). Cap small: 8 × 3 = 24, plenty for dev, well under the limit.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  # ── runtime knobs ────────────────────────────────────────────────────────
  # logback's APP_FILE appender defaults to a Windows host path; point it at a container-writable
  # dir (non-root `spring` can't write /app). /tmp is ephemeral disk — fine, kubectl logs uses stdout.
  APP_LOG_DIR: /tmp
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"   # serve /actuator/health/liveness & /readiness
  # §perf: cap heap+metaspace, low-overhead SerialGC, and -XX:TieredStopAtLevel=1 = C1-only JIT
  # → much faster startup under CPU contention (skips the costly C2 compiler; fine for dev pods).
  JAVA_TOOL_OPTIONS: "-Xmx224m -XX:MaxMetaspaceSize=176m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
---
apiVersion: v1
kind: Secret
metadata:
  name: vabags-db
  namespace: vabags
type: Opaque
stringData:                       # stringData = plaintext here; k8s base64-encodes it at rest
  SPRING_DATASOURCE_USERNAME: eventuate
  SPRING_DATASOURCE_PASSWORD: eventuate
