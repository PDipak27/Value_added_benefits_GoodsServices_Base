# Edge gateway (LITE). Exposed to the host via a LoadBalancer Service.
# Runs the `lite` Spring profile: auth OFF, plain HTTP (no keystore), single order route.
# The order route target is repointed at the in-cluster Service DNS via ORDER_SERVICE_URI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: vabags-lite
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: vabags/api-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef: { name: vabags-lite-endpoints }
            - secretRef: { name: vabags-lite-db }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "lite" }                 # auth off, plain HTTP, order-only route
            - { name: GATEWAY_SSL_ENABLED,    value: "false" }                # belt-and-braces (lite profile already disables)
            - { name: ORDER_SERVICE_URI,      value: "http://lite-order-service:8081" }
          startupProbe:                     # gate liveness/readiness until boot finishes (slow under CPU contention)
            httpGet: { path: /actuator/health/liveness, port: 8089 }
            failureThreshold: 5
            periodSeconds: 60                # up to ~300s to start
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8089 }
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8089 }
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: vabags-lite
spec:
  type: LoadBalancer          # k3d/Docker Desktop publishes this on localhost:8089
  selector: { app: api-gateway }
  ports:
    - port: 8089
      targetPort: 8089
