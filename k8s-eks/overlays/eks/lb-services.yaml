# Public entry points on AWS-provided hostnames (no custom domain → no ACM certificate).
# Each is an NLB doing plain TCP passthrough; TLS, where used, is terminated by the pod itself
# with the self-signed cert generated by scripts/gen-selfsigned-tls.sh.
#
#   api-gateway-public  https://<nlb>.elb.<region>.amazonaws.com   → gateway :8089 (TLS in-app)
#   keycloak-public     https://<nlb>...                            → Keycloak :8443 (TLS in-app)
#   ott-public          http://<nlb>...                             → ott-service :8087
#
# deploy.sh applies this file FIRST and waits for the three hostnames, because Keycloak's
# KC_HOSTNAME / the token `iss` and the OTT redirect URI must be known before anything boots.
# Hostnames stay stable for as long as these Services exist (they are deleted with the cluster).
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-public
  namespace: vabags
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
    - { name: https, port: 443, targetPort: 8089 }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-public
  namespace: vabags
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector: { app: keycloak }
  ports:
    - { name: https, port: 443, targetPort: 8443 }
---
apiVersion: v1
kind: Service
metadata:
  name: ott-public
  namespace: vabags
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector: { app: ott-service }
  ports:
    - { name: http, port: 80, targetPort: 8087 }
