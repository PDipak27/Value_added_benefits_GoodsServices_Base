# Order service — saga orchestrator, command side (Postgres + Tram outbox) and CQRS read side
# (Mongo projections), JWT resource server (token relayed by the gateway).
# Image is the bare name `vabags/order-service`; deploy.sh rewrites it to <ECR>/vabags/order-service:<git-sha>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
      annotations:
        vab/public-config-hash: PUBLIC_CONFIG_HASH   # deploy.sh → restart when public URLs change
    spec:
      containers:
        - name: order-service
          image: vabags/order-service
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: vabags-endpoints }
            - configMapRef: { name: vabags-public }      # KEYCLOAK_ISSUER (public iss)
            - secretRef: { name: vabags-secrets }
          startupProbe:                    # slow JVM boot on small shared nodes
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "320Mi" }
            limits: { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector: { app: order-service }
  ports:
    - port: 8081
      targetPort: 8081
