# Environment-agnostic base: 8 services + in-cluster infra
# (Postgres, Kafka KRaft, ZooKeeper, eventuate-cdc, Mongo, Redis, Keycloak).
# Overlays add how the stack is exposed (overlays/eks = AWS NLBs).
#
# The pg-init generator reads ../../deploy/postgres-init (outside this dir), so builds need:
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s-eks/overlays/eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vabags

resources:
  - 00-config.yaml
  - 01-postgres.yaml
  - 02-kafka.yaml
  - 03-zookeeper-cdc.yaml
  - 04-mongo-redis.yaml
  - 05-keycloak.yaml
  - 10-api-gateway.yaml
  - 11-order-service.yaml
  - 12-inventory-service.yaml
  - 13-billing-service.yaml
  - 14-notification-service.yaml
  - 15-catalog-service.yaml
  - 16-fulfilment-service.yaml
  - 17-ott-service.yaml

configMapGenerator:
  # 01 = eventuate outbox/event tables, 03 = keycloak database, 04 = Tram saga tables.
  # (02 is the WAL-mode placeholder — not needed with EventuatePolling.)
  - name: pg-init
    files:
      - ../../deploy/postgres-init/01-eventuate-schema.sql
      - ../../deploy/postgres-init/03-keycloak-db.sql
      - ../../deploy/postgres-init/04-tram-saga-schema.sql

labels:
  - pairs: { app.kubernetes.io/part-of: vabags }
    includeSelectors: false
