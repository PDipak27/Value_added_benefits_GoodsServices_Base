# ZooKeeper — used ONLY by eventuate-cdc for its leader lock (Kafka itself is KRaft). Ephemeral
# state is fine: a restart just re-elects the single CDC instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: zookeeper }
  template:
    metadata:
      labels: { app: zookeeper }
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.7.1
          ports:
            - containerPort: 2181
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms64m -Xmx192m" }
            - { name: TZ, value: Asia/Kolkata }
          readinessProbe:
            tcpSocket: { port: 2181 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "192Mi" }
            limits: { memory: "320Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  selector: { app: zookeeper }
  ports:
    - port: 2181
      targetPort: 2181
---
# Eventuate CDC — polls the Tram outbox (eventuate.message) in Postgres and relays to
# Kafka. Exactly ONE replica with Recreate: two relays would race for the ZooKeeper leader lock and
# a rolling update would briefly run both. Without it no saga ever advances past its first command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventuate-cdc
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: eventuate-cdc }
  template:
    metadata:
      labels: { app: eventuate-cdc }
    spec:
      containers:
        - name: eventuate-cdc
          image: eventuateio/eventuate-cdc-service:0.19.0.RELEASE
          ports:
            - containerPort: 8080
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/vab" }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: vabags-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: vabags-secrets, key: SPRING_DATASOURCE_PASSWORD } }
            - { name: SPRING_DATASOURCE_DRIVER_CLASS_NAME, value: "org.postgresql.Driver" }
            - { name: EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING, value: "zookeeper:2181" }
            - { name: SPRING_PROFILES_ACTIVE, value: "EventuatePolling,Kafka" }
            - { name: EVENTUATE_CDC_PIPELINE_TRAMPIPELINE_TYPE, value: "eventuate-tram" }
            - { name: EVENTUATE_CDC_PIPELINE_TRAMPIPELINE_READER, value: "tramreader" }
            - { name: EVENTUATE_CDC_PIPELINE_TRAMPIPELINE_EVENTUATEDATABASESCHEMA, value: "eventuate" }
            - { name: EVENTUATE_CDC_READER_TRAMREADER_TYPE, value: "polling" }
            - { name: EVENTUATE_CDC_READER_TRAMREADER_DATASOURCEURL, value: "jdbc:postgresql://postgres:5432/vab" }
            - name: EVENTUATE_CDC_READER_TRAMREADER_DATASOURCEUSERNAME
              valueFrom: { secretKeyRef: { name: vabags-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: EVENTUATE_CDC_READER_TRAMREADER_DATASOURCEPASSWORD
              valueFrom: { secretKeyRef: { name: vabags-secrets, key: SPRING_DATASOURCE_PASSWORD } }
            - { name: EVENTUATE_CDC_READER_TRAMREADER_DATASOURCEDRIVERCLASSNAME, value: "org.postgresql.Driver" }
            - { name: EVENTUATE_CDC_READER_TRAMREADER_LEADERSHIPLOCKPATH, value: "/eventuate/cdc/leader/tram" }
            - { name: EVENTUATE_CDC_READER_TRAMREADER_OUTBOXID, value: "2" }
            - { name: JAVA_OPTS, value: "-Xmx320m" }
            - { name: TZ, value: Asia/Kolkata }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits: { memory: "512Mi" }
