# Postgres 18 — write models (orders/inventory/billing/fulfilment/notification/ott schemas),
# Tram outbox + saga tables (eventuate schema) and the Keycloak DB. StatefulSet + gp3 PVC, so
# data survives pod restarts (unlike Lite's emptyDir).
#
# Init SQL (01 eventuate schema, 03 keycloak DB, 04 tram-saga tables) comes from the pg-init
# ConfigMap generated by kustomize from deploy/postgres-init. NOTE: docker-entrypoint-initdb.d only
# runs on an EMPTY data dir — i.e. on the first start of a fresh PVC. That's fine because the PVC is
# deleted with the cluster; if you ever reuse a PVC, apply schema changes by hand (all scripts are
# IF NOT EXISTS-safe except CREATE DATABASE keycloak).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - { name: POSTGRES_DB, value: vab }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: vabags-secrets, key: SPRING_DATASOURCE_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: vabags-secrets, key: SPRING_DATASOURCE_PASSWORD } }
            - { name: TZ, value: Asia/Kolkata }
            # Sub-directory of the mount: an EBS volume's root holds lost+found, which initdb refuses.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          args: ["-c", "max_connections=100"]
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d vab"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
      volumes:
        - name: initdb
          configMap: { name: pg-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
