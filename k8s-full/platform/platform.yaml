# Cluster-level prerequisites for the FULL edition on EKS — applied once per cluster by
# infra/eks/create-cluster.sh (and re-applied idempotently by k8s-full/scripts/deploy.sh).
#
# gp3 StorageClass: EKS no longer marks any StorageClass as default, and the in-tree gp2 class
# can't be used by the EBS CSI driver. WaitForFirstConsumer = the volume is created in the AZ
# where the pod actually lands (PVCs are AZ-bound — the classic "pod Pending: volume node
# affinity conflict" trap after a spot node is replaced in another AZ).
apiVersion: v1
kind: Namespace
metadata:
  name: vabags
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  fsType: ext4
