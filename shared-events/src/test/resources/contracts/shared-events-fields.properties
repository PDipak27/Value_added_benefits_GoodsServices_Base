# Wire contract of the shared saga commands/replies and Order domain events:
# fully-qualified class = sorted JSON property names as serialized by Eventuate's JSonMapper.
# Producers and consumers live in different services and deploy independently, so a rename
# or removal here breaks the other side at runtime. Change a line ONLY together with every
# producer and consumer of that message (SharedEventsContractTest enforces this file).
