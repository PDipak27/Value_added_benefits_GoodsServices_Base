server:
  port: 8091
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: payment-sim

# Design/15: the one merchant account. The defaults are test values; in k8s they come from vabags-secrets
# (VAB_PSP_KEY_SECRET, VAB_PSP_WEBHOOK_SECRET) and the public URL from vabags-public.
vab:
  psp:
    key-id: ${VAB_PSP_KEY_ID:vab_test_key}
    key-secret: ${VAB_PSP_KEY_SECRET:vab_test_secret}
    webhook-secret: ${VAB_PSP_WEBHOOK_SECRET:whsec_vab_test}
    webhook-url: ${VAB_PSP_WEBHOOK_URL:http://localhost:8083/webhooks/psp}
    public-base-url: ${PAYMENT_SIM_PUBLIC_URL:http://localhost:8091}
    intent-ttl: 8m

management:
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.vab: DEBUG

---
spring:
  config:
    activate:
      on-profile: obs
management:
  otlp:
    tracing:
      export:
        enabled: true
