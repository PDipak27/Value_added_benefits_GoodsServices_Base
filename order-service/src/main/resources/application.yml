server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: order-service
  # Design/13 §8.1: every outbound HTTP call is bounded (applies to the auto-configured RestClient.Builder).
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

  # ── §A-3/A5: validate the gateway-relayed Keycloak JWT (JWKS via issuer-uri).
  #    Keycloak must be up before order-service starts (discovery is eager). ──
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8088/realms/vab}

  # ── Postgres (write side: order state + Tram outbox + idempotency) ──────
  datasource:
    url: jdbc:postgresql://localhost:5432/vab
    username: eventuate
    password: eventuate
    driver-class-name: org.postgresql.Driver
    # Design/13 §8.1: bounded waits. A blocked pool fails in 3 s; a statement or lock wait can't hang a
    # consumer forever (55P03 / 57014 are retried by shared-messaging's decorator).
    hikari:
      connection-timeout: 3000
      data-source-properties:
        options: "-c statement_timeout=10000 -c lock_timeout=3000"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders

  flyway:
    enabled: true
    schemas: orders
    locations:             #flyway auto adds locations.
    - classpath:db/migration
#    - classpath:flyway/postgresql

  # ── MongoDB (read side: projections) ───────────────────────────────────
  data:
    mongodb:
      uri: mongodb://localhost:27017/vab

# ── Catalog service (best-effort productType verification at placement) ─────
catalog:
  base-url: http://localhost:8085

# ── Eventuate Tram — outbox + dedup tables live in the 'eventuate' schema ──
eventuate:
  database:
    schema: eventuate
  # Design/13 §8.3: pause a partition instead of buffering an unbounded backlog while a handler waits.
  local:
    kafka:
      consumer:
        back-pressure:
          low: 100
          high: 500

# ── Eventuate Tram / Kafka ─────────────────────────────────────────────────
eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9094
  # zookeeper.connection.string intentionally omitted — KRaft mode, not needed

# ── Actuator ───────────────────────────────────────────────────────────────
management:
  # §perf: default OFF (0.0) — the traceId is still generated & propagated (so it shows in file/console
  # logs), but nothing is recorded or exported, so Tempo isn't needed. The `obs` profile flips it to 1.0.
  tracing:
    sampling:
      probability: 0.0
  # §perf: no span export unless `obs` is active — old sampled traceparents on Kafka messages
  # would otherwise force export attempts at Tempo (parent-based sampler honours them).
  otlp:
    tracing:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Status is public (probes); component details (DB/Mongo/Kafka) only for vab-admin.
      show-details: when-authorized
      roles: vab-admin
      # Design/13 §9: a dead Eventuate subscription fails liveness (k8s restarts the pod).
      probes:
        enabled: true          # livenessState / readinessState exist outside k8s too
      group:
        liveness:
          include: livenessState,eventuateSubscriptions

logging:
  level:
    com.vab: DEBUG
    io.eventuate: INFO

---
# §perf: `obs` profile — record + export every trace to Tempo (pair with COMPOSE_PROFILES=obs).
spring:
  config:
    activate:
      on-profile: obs
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        enabled: true
